<style>

<script>
const TODAY = new Date().toISOString().slice(0,10), BR = ['Gokul','Chitale','Amul','Shivanand'], KEY = 'milkerp_crate_v2';
const $ = s => document.querySelector(s), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const addD = (d, n) => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const fd = d => d.slice(8) + '/' + d.slice(5, 7), sum = (a, k) => a.reduce((x, t) => x + (+t[k] || 0), 0), inr = n => '₹' + Math.round(n).toLocaleString('en-IN');

// Simplified 8 Core Modules instead of 12 cluttered ones
const PAGES = ['Dashboard','Daily Register','Monthly Excel Sheet','Daily Bills','Payments & Jama','Crate Management','Retailers & Rates','Settings & Backup'];
const KEYS = ['dash','reg','mon','bill','pay','crate','ret','set'];
const MR = ['डॅशबोर्ड','दैनिक नोंदवही','मासिक Excel शीट','दैनिक बिल','पेमेंट व जमा','क्रेट हिशोब','विक्रेते व दर','सेटिंग्ज व बॅकअप'];

let S, page = 'dash', D = TODAY, BL = 'R101', MM = TODAY.slice(0, 7), MR2 = 'R101';

function seed() {
  const prod = [
    { id: 'gf', brand: 'Gokul', name: 'FC 500ml', mr: 'गोकुळ फुल क्रीम', cap: 12, rate: 71.3 },
    { id: 'gc', brand: 'Gokul', name: 'Cow 500ml', mr: 'गोकुळ काऊ', cap: 10, rate: 53 },
    { id: 'cf', brand: 'Chitale', name: 'FC 500ml', mr: 'चितळे फुल क्रीम', cap: 12, rate: 71 },
    { id: 'cc', brand: 'Chitale', name: 'Cow 500ml', mr: 'चितळे काऊ', cap: 12, rate: 55 },
    { id: 'ct', brand: 'Chitale', name: 'Tea Special', mr: 'चितळे स्पेशल टी', cap: 12, rate: 65 },
    { id: 'at', brand: 'Amul', name: 'Taaza 500ml', mr: 'अमूल ताजा', cap: 12, rate: 55 },
    { id: 'ag', brand: 'Amul', name: 'Gold 500ml', mr: 'अमूल गोल्ड', cap: 12, rate: 65 },
    { id: 'st', brand: 'Shivanand', name: 'Tond 500ml', mr: 'श्रीनंद टोन्ड', cap: 10, rate: 36 },
    { id: 'ss', brand: 'Shivanand', name: 'SPL 500ml', mr: 'श्रीनंद स्पेशल', cap: 10, rate: 37 },
    { id: 'ns', brand: 'Nature', name: 'Standard', mr: 'नेचर स्टँडर्ड', cap: 12, rate: 50 },
    { id: 'nd2', brand: 'Nature', name: 'Dahi 200g', mr: 'नेचर दही २००g', cap: 12, rate: 74 },
    { id: 'gvc', brand: 'Govind', name: 'Cow 500ml', mr: 'गोविंद काऊ', cap: 12, rate: 49.5 },
    { id: 'gvs', brand: 'Govind', name: 'Standard', mr: 'गोविंद स्टँडर्ड', cap: 12, rate: 51 },
    { id: 'gd2', brand: 'Govind', name: 'Dahi 200g', mr: 'गोविंद दही २००g', cap: 12, rate: 66.85 },
    { id: 'gt', brand: 'Govind', name: 'Tak', mr: 'गोविंद ताक', cap: 12, rate: 31 },
    { id: 'thc', brand: 'Thorat', name: 'Cow 500ml', mr: 'थोरात काऊ', cap: 10, rate: 52.7 },
    { id: 'wfc', brand: 'Warna', name: 'FC 500ml', mr: 'वारणा फुल क्रीम', cap: 12, rate: 56 }
  ];

  const customers = [
    { id: 'R101', name: 'प्रवीण कदम (Pravin Kadam)', route: 'Kothrud', mob: '9822011223', prevOut: 199587 },
    { id: 'R102', name: 'ओवी गायकवाड (Ovi Gaikwad)', route: 'Hadapsar', mob: '9822044556', prevOut: 75520 },
    { id: 'R103', name: 'प्रफुल (Praful Dairy)', route: 'Baner', mob: '9822077889', prevOut: 346188 },
    { id: 'R104', name: 'आबा तिखे (Aaba Tikhe)', route: 'Wakad', mob: '9822099001', prevOut: 184300 },
    { id: 'R105', name: 'विनोद बिरादार (Vinod Biradar)', route: 'Hadapsar', mob: '9822022334', prevOut: 259475 },
    { id: 'R106', name: 'तुनतुने (Tuntune)', route: 'Kothrud', mob: '9822055667', prevOut: 85394 },
    { id: 'R107', name: 'सुनील ठानगे (Sunil Thange)', route: 'Baner', mob: '9822088990', prevOut: 264961 },
    { id: 'R108', name: 'ठाकूर मामा (Thakur Mama)', route: 'Wakad', mob: '9822011002', prevOut: 72630 },
    { id: 'R109', name: 'आप्पा बराटे (Appa Barate)', route: 'Kothrud', mob: '9822033445', prevOut: 0 },
    { id: 'R110', name: 'संतोष आव्हाळे (Santosh Awhale)', route: 'Hadapsar', mob: '9822066778', prevOut: 47750 },
    { id: 'R111', name: 'तरटे (Tarte)', route: 'Baner', mob: '9822099112', prevOut: 0 },
    { id: 'R112', name: 'आतिश दिवेकर (Aatish Divekar)', route: 'Wakad', mob: '9822022446', prevOut: 0 },
    { id: 'R113', name: 'अरुण/दिलीप-झेन सर कंपनी', route: 'Kothrud', mob: '9822055779', prevOut: 150745 }
  ];

  const ret = customers.map(c => ({
    ...c,
    open: { Gokul: 10, Chitale: 8, Amul: 4, Shivanand: 2 }
  }));

  const o = {};
  o[TODAY] = {
    R101: { gf: 477, gc: 30, cf: 105, cc: 171.5, ss: 31, ns: 20, nd2: 12, gt: 10, ag: 30 },
    R102: { gf: 380, gc: 50 },
    R103: { cf: 204, cc: 300 },
    R104: { cf: 144, cc: 168 },
    R105: { cf: 168, cc: 312 },
    R106: { cf: 132 },
    R107: { cf: 204, cc: 168 },
    R108: { cf: 180, cc: 240 }
  };

  const tx = [];
  let id = 1;
  ret.forEach(r => {
    BR.forEach(b => {
      tx.push({ id: id++, date: TODAY, r: r.id, b, iss: 4, ret: 2, cap: 12, src: 'register', void: 0 });
    });
  });

  const pay = [
    { id: id++, date: TODAY, r: 'R101', amt: 22000, m: 'Cash', ref: 'Cash hand', al: 'Account', void: 0 },
    { id: id++, date: TODAY, r: 'R102', amt: 27770, m: 'Online', ref: 'UPI-481920', al: 'Account', void: 0 },
    { id: id++, date: TODAY, r: 'R103', amt: 50160, m: 'Cash', ref: 'Cash hand', al: 'Account', void: 0 }
  ];

  return {
    prod,
    ret,
    tx,
    orders: o,
    pay,
    audit: [],
    seq: id + 50,
    cfg: { hi: 25, days: 5, dep: 0, mr: 0, cut: '18:00', biz: 'निखिल दुध डेअरी (Nikhil Milk Dairy Pune)', pre: 'INV', pm: 'Cash,Online,Cheque' }
  };
}

function load() {
  try {
    const v = localStorage.getItem(KEY);
    return v ? JSON.parse(v) : null;
  } catch(e) { return null; }
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
    syncToPostgres();
  } catch(e) {}
}

async function syncToPostgres() {
  try {
    await fetch('http://localhost:8000/api/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prod: S.prod, ret: S.ret, cfg: S.cfg })
    });
  } catch(e) {}
}

S = load() || seed();
fix();

const toast = m => {
  const t = $('#toast');
  t.textContent = trs(m);
  t.style.display = 'block';
  clearTimeout(t.h);
  t.h = setTimeout(() => t.style.display = 'none', 2500);
};

// Pure calculations
const act = () => S.tx.filter(t => !t.void), RT = id => S.ret.find(r => r.id == id) || { name: id, route: '', open: {}, prevOut: 0 }, brandCap = b => { const p = S.prod.find(p => p.brand == b); return p ? p.cap : 12; };
const bal = (r, b, d, inc) => { const rt = RT(r); return (rt.open && rt.open[b] || 0) + act().filter(t => t.r == r && t.b == b && (inc ? t.date <= d : t.date < d)).reduce((a, t) => a + t.iss - t.ret, 0); };
const day = (r, b, d) => { const T = act().filter(t => t.r == r && t.b == b && t.date == d), iss = sum(T, 'iss'), rt = sum(T, 'ret'), o = bal(r, b, d); return { o, iss, rt, c: o + iss - rt }; };
const ord = (r, p) => (S.orders[D] && S.orders[D][r] && S.orders[D][r][p]);
const rate = (p, d) => (S.snap && S.snap[d] && S.snap[d][p.id]) || p.rate;
const line = (r, d) => S.prod.map(p => ({ p, q: ((S.orders[d] || {})[r] || {})[p.id] || 0, rt: rate(p, d) })).filter(x => x.q);
const billed = (r, d) => line(r, d).reduce((a, x) => a + x.q * x.rt, 0);
const paid = (r, d) => S.pay.filter(x => x.r == r && !x.void && (!d || x.date == d)).reduce((a, x) => a + x.amt, 0);
const allb = r => Object.keys(S.orders).reduce((a, d) => a + billed(r, d), 0);
const outst = r => (RT(r).prevOut || 0) + allb(r) - paid(r);
const fb = n => n < 0 ? '<span class="pill a">Advance ' + inr(-n) + '</span>' : inr(n);
const coR = (r, d) => (RT(r).prevOut || 0) + Object.keys(S.orders).filter(x => x <= d).reduce((a, x) => a + billed(r, x), 0) - S.pay.filter(x => x.r == r && !x.void && x.date <= d).reduce((a, x) => a + x.amt, 0);

function fix() {
  S.prod = S.prod || seed().prod;
  S.ret = S.ret || seed().ret;
  S.orders = S.orders || {};
  S.pay = S.pay || [];
  S.tx = S.tx || [];
  S.cfg = S.cfg || seed().cfg;
  S.cfg.biz = S.cfg.biz || 'निखिल दुध डेअरी (Pune)';
}

// Shell Sidebar Navigation
function go() {
  $('#nav').innerHTML = `
    <div class="logo">🥛 <span>Milk ERP</span></div>
    <a onclick="S.cfg.mr=S.cfg.mr?0:1;save();go()">🌐 English / मराठी</a>
    ${PAGES.map((p, i) => `
      <a class="${KEYS[i] == page ? 'on' : ''}" onclick="nav('${KEYS[i]}')">
        <span>${['📊','📋','📈','🧾','💰','📦','🏪','⚙️'][i]}</span>
        <span>${S.cfg.mr ? MR[i] : p}</span>
      </a>
    `).join('')}
  `;
  const f = { dash: pDash, reg: pReg, mon: pMon, bill: pBill, pay: pPay, crate: pCrate, ret: pRet, set: pSet }[page];
  $('#main').innerHTML = f();
  tr($('#nav'));
  tr($('#main'));
  if (page == 'reg') refresh();
}
const nav = p => { page = p; go(); };

// ==========================================
// 1. SIMPLE & CLEAN DASHBOARD
// ==========================================
function pDash() {
  // Key Metrics
  const todaySales = S.ret.reduce((a, r) => a + billed(r.id, TODAY), 0);
  const todayPouches = S.ret.reduce((a, r) => a + S.prod.reduce((x, p) => x + (ord(r.id, p.id) || 0), 0), 0);
  const todayPaidCash = S.pay.filter(x => x.date == TODAY && !x.void && x.m == 'Cash').reduce((a, x) => a + x.amt, 0);
  const todayPaidOnline = S.pay.filter(x => x.date == TODAY && !x.void && x.m != 'Cash').reduce((a, x) => a + x.amt, 0);
  const totalMarketDue = S.ret.reduce((a, r) => a + Math.max(0, outst(r.id)), 0);
  const totalCratesOut = S.ret.reduce((a, r) => a + BR.reduce((x, b) => x + bal(r.id, b, TODAY, 1), 0), 0);

  return `
    <h1>${S.cfg.mr ? 'डॅशबोर्ड' : 'Business Dashboard'}</h1>
    <p class="sub">${new Date().toLocaleDateString(S.cfg.mr ? 'mr-IN' : 'en-IN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })} • Pune</p>

    <!-- 4 BIG CLEAN CARDS -->
    <div class="cards">
      <div class="card">
        <span>${S.cfg.mr ? 'आजची दूध विक्री (रक्कम)' : "Today's Milk Sales"}</span>
        <b>${inr(todaySales)}</b>
        <small style="color:var(--mu)">${todayPouches} pouches delivered</small>
      </div>
      <div class="card">
        <span>${S.cfg.mr ? 'आज जमा रक्कम (वसुली)' : "Today's Total Jama"}</span>
        <b style="color:#16a34a">${inr(todayPaidCash + todayPaidOnline)}</b>
        <small style="color:var(--mu)">Cash: ${inr(todayPaidCash)} • Online: ${inr(todayPaidOnline)}</small>
      </div>
      <div class="card bad">
        <span>${S.cfg.mr ? 'मार्केटमधील एकूण येणे बाकी' : 'Total Market Outstanding'}</span>
        <b>${inr(totalMarketDue)}</b>
        <small style="color:var(--mu)">Across all ${S.ret.length} customers</small>
      </div>
      <div class="card amber">
        <span>${S.cfg.mr ? 'मार्केटमधील एकूण क्रेट' : 'Crates with Retailers'}</span>
        <b>${totalCratesOut}</b>
        <small style="color:var(--mu)">Gokul, Chitale, Amul, Shivanand</small>
      </div>
    </div>

    <!-- 4 BIG FAST-ACTION BUTTONS -->
    <div class="action-grid">
      <div class="action-btn" onclick="nav('reg')">
        <span class="icon">📋</span>
        <div>
          <span class="tit">${S.cfg.mr ? 'दैनिक नोंदवही' : 'Daily Register'}</span>
          <span class="desc">${S.cfg.mr ? 'आजचे दूध व क्रेट भरा' : "Fill today's milk & crates"}</span>
        </div>
      </div>
      <div class="action-btn" onclick="nav('mon')">
        <span class="icon">📈</span>
        <div>
          <span class="tit">${S.cfg.mr ? 'मासिक Excel शीट' : 'Customer Excel Sheet'}</span>
          <span class="desc">${S.cfg.mr ? 'दिवसवार आपोआप हिशोब व डाउनलोड' : 'Auto daily rows & 1-click Excel'}</span>
        </div>
      </div>
      <div class="action-btn" onclick="nav('bill')">
        <span class="icon">🧾</span>
        <div>
          <span class="tit">${S.cfg.mr ? 'दैनिक बिल पाठवा' : "Send Daily Bill"}</span>
          <span class="desc">${S.cfg.mr ? 'WhatsApp साठी इमेज डाउनलोड' : '1-click WhatsApp bill image'}</span>
        </div>
      </div>
      <div class="action-btn" onclick="nav('pay')">
        <span class="icon">💰</span>
        <div>
          <span class="tit">${S.cfg.mr ? 'पेमेंट नोंदवा (जमा)' : 'Record Payment / Jama'}</span>
          <span class="desc">${S.cfg.mr ? 'रोख किंवा ऑनलाईन पावती' : 'Cash or Online collection receipt'}</span>
        </div>
      </div>
    </div>

    <!-- SIMPLE TODAY'S SNAPSHOT TABLE -->
    <div class="box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <b style="font-size:15px">${S.cfg.mr ? 'आजचा ग्राहक सारांश' : "Today's Customer Snapshot"}</b>

function commit(el) {
  const { t, id, x } = el.dataset, v = el.value === '' ? undefined : Math.max(0, t == 'q' ? +el.value : Math.floor(+el.value));
  if (t == 'q') {
    S.orders[D] = S.orders[D] || {};
    S.orders[D][id] = S.orders[D][id] || {};
    if (v === undefined) delete S.orders[D][id][x];
    else S.orders[D][id][x] = v;
    el.classList.toggle('e', v === undefined);
  } else {
    setReg(id, x, t == 'i' ? 'iss' : 'ret', v || 0);
  }
  save();
  refresh();
}

function setReg(r, b, f, v) {
  let g = S.tx.find(t => t.r == r && t.b == b && t.date == D && !t.void);

    g = { id: S.seq++, date: D, r, b, iss: 0, ret: 0, cap: brandCap(b), src: 'register', void: 0 };

}

function buildCustomerSheetData(rid, monthStr) {
  const [y, m] = monthStr.split('-').map(Number);
  const n = new Date(y, m, 0).getDate();
  const ds = [];
  for (let i = 1; i <= n; i++) {
    const d = monthStr + '-' + String(i).padStart(2, '0');
    if (d <= TODAY || monthStr < TODAY.slice(0, 7)) ds.push(d);
  }

  const r = RT(rid);
  const P = S.prod;
  const nb = P.length + 1;
  const header = ['Date', ...P.map(p => p.name), 'Todays Payment', 'Pre. Balance', 'Total Amount', 'Cash Jama', 'Online Jama', 'Total Jama', 'Balance Pending', 'Remarks'];

  const rows = [];
  let prevBal = coR(r.id, addD(monthStr + '-01', -1));

  ds.forEach(d => {
    const o = (S.orders[d] || {})[r.id] || {};
    let todaysPay = 0;
    const quantities = P.map(p => {
      const q = o[p.id];
      if (q != null && q > 0) {
        todaysPay += (q * rate(p, d));
        return q;
      }
      return '';
    });

    const totalAmt = prevBal + todaysPay;
    const dayPayments = S.pay.filter(x => x.r == r.id && !x.void && x.date == d);
    const cash = dayPayments.filter(x => x.m == 'Cash').reduce((a, b) => a + b.amt, 0);
    const online = dayPayments.filter(x => x.m != 'Cash').reduce((a, b) => a + b.amt, 0);
    const totalJama = cash + online;
    const balancePending = totalAmt - totalJama;

    let note = '';
    if (todaysPay === 0 && totalJama === 0 && d <= TODAY) note = 'Sutti';

    rows.push([
      d,
      ...quantities,
      Math.round(todaysPay * 100) / 100,
      Math.round(prevBal * 100) / 100,
      Math.round(totalAmt * 100) / 100,
      cash || '',
      online || '',
      totalJama || '',
      Math.round(balancePending * 100) / 100,
      note
    ]);

    prevBal = balancePending;
  });

  return { header, rows, P, nb };
}

function exportFullJSONBackup() {
  const jsonStr = JSON.stringify(S, null, 2);
  const blob = new Blob([jsonStr], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Nikhil_Milk_Backup_${TODAY}.json`;
  a.click();
  toast('Company backup saved to your laptop!');
}

function restoreFullJSONBackup(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      S = JSON.parse(e.target.result);
      fix();
      save();
      go();
      toast('Backup restored successfully!');
    } catch(err) {
      alert('Error: ' + err.message);
    }
  };
  reader.readAsText(file);
}

// Marathi Translator
const DIC = ['Dashboard','डॅशबोर्ड','Daily Register','दैनिक नोंदवही','Monthly Excel Sheet','मासिक Excel शीट','Daily Bills','दैनिक बिल','Payments & Jama','पेमेंट व जमा','Crate Management','क्रेट हिशोब','Retailers & Rates','विक्रेते व दर','Settings & Backup','सेटिंग्ज व बॅकअप','Customer','ग्राहक','Total Amount','एकूण रक्कम','Cash Jama','रोख जमा','Online Jama','ऑनलाईन जमा','Total Jama','एकूण जमा','Balance Pending','बाकी रक्कम'];
let DK = [];
for (let i = 0; i < DIC.length; i += 2) DK.push([new RegExp('(?<![A-Za-z])' + DIC[i].replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![A-Za-z])', 'g'), DIC[i + 1], DIC[i].length]);
DK.sort((a, b) => b[2] - a[2]);
const trs = s => S.cfg.mr ? DK.reduce((a, k) => a.replace(k[0], () => k[1]), s) : s;
function tr(root) {
  if (!S.cfg.mr || !root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), L = [];
  let n; while (n = w.nextNode()) L.push(n);
  L.forEach(n => { if (/[A-Za-z]/.test(n.nodeValue)) n.nodeValue = trs(n.nodeValue); });
}

go();
