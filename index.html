function setBagDeliveryToday(rId, isBag) {
  const q = reqCrates(rId, D);
  if (isBag) {
    setReg(rId, 'iss', 0, true);
    toast(`${RT(rId).name}: 0 crates issued today (Bag delivery)`);
  } else {
    setReg(rId, 'iss', q, false);
    const regTx = S.tx.find(t => t.r == rId && t.date == D && t.src == 'register' && !t.void);
    if (regTx) regTx.issManual = false;
    toast(`${RT(rId).name}: Restored auto crates (${q} crates)`);
  }
  save();
  $('#dlg').close();
  go();
}

function togglePermanentBag(rId, isPermanent) {
  const r = RT(rId);
  if (!r) return;
  r.noCrates = !!isPermanent;
  if (r.noCrates) {
    setReg(rId, 'iss', 0, true);
  } else {
    syncAutoCrates(D);
  }
  save();
  go();
  toast(`${r.name}: ${r.noCrates ? 'Marked as Permanent Bag Customer' : 'Marked as Crate Customer'}`);
}

function toggleBagToday(rId) {
  const x = dayTot(rId, D);
  const regTx = S.tx.find(t => t.r == rId && t.date == D && t.src == 'register' && !t.void);
  if (x.iss === 0 && regTx && regTx.issManual) {
    setBagDeliveryToday(rId, false);
  } else {
    setBagDeliveryToday(rId, true);
  }
}

function refresh() {
  const Tot = [0, 0, 0, 0];
  S.ret.forEach(r => {
    const x = dayTot(r.id, D);
    const oEl = $('#o_' + r.id);
    if (oEl) {
      const span = oEl.querySelector('span');
      if (span) span.textContent = x.o;
      else oEl.textContent = x.o;
    }
    const cEl = $('#c_' + r.id);
    if (cEl) {
      const bTag = cEl.querySelector('b');
      if (bTag) bTag.textContent = x.c;
      else cEl.textContent = x.c;
      cEl.className = x.c < 0 ? 'neg' : '';
    }
    const iEl = $('#i_' + r.id);
    if (iEl) {
      const regTx = S.tx.find(t => t.r == r.id && t.date == D && t.src == 'register' && !t.void);
      if (!regTx || !regTx.issManual) {
        iEl.value = (x.iss !== undefined && x.iss !== null) ? x.iss : '';
      }
      iEl.placeholder = r.noCrates ? '0' : (x.q || '0');
    }
    const rEl = $('#r_' + r.id);
    if (rEl) {
      if (rEl.value === '' && x.rt) rEl.value = x.rt;
    }
    [x.o, x.iss, x.rt, x.c].forEach((v, i) => Tot[i] += v);
  });
  S.prod.forEach(p => {
    let tCrate = 0, tBag = 0;
    S.ret.forEach(r => {
      const q = ord(r.id, p.id) || 0;
      if (q > 0) {
        if (isBagRetailer(r, D)) tBag += q;
        else tCrate += q;
      }
    });
    const t = tCrate + tBag;
    const el = $('#tq_' + p.id);
    if (el) {
      el.innerHTML = `${t}<small>${formatReqCrates(tCrate, tBag, p.cap)}</small>`;
    }
  });
  if ($('#to_tot')) $('#to_tot').textContent = Tot[0];
  if ($('#ti_tot')) $('#ti_tot').textContent = Tot[1];
  if ($('#tr_tot')) $('#tr_tot').textContent = Tot[2];
  if ($('#tc_tot')) $('#tc_tot').textContent = Tot[3];
}

function commit(el) {
  if (S.fin[D] == 'Finalized' && el.dataset.t == 'q') {
    toast('Day is finalized – reopen it from Milk Requirement');
    go();
    return;
  }
  const { t, id, x } = el.dataset, v = el.value === '' ? undefined : Math.max(0, t == 'q' ? +el.value : Math.floor(+el.value));
  if (t == 'q') {
    S.orders[D] = S.orders[D] || {};
    S.orders[D][id] = S.orders[D][id] || {};
    if (v === undefined) delete S.orders[D][id][x];
    else S.orders[D][id][x] = v;
    el.classList.toggle('e', v === undefined);
    syncAutoCrates(D);
  } else {
    setReg(id, t == 'i' ? 'iss' : 'ret', v, t == 'i');
  }
  save();
  refresh();
}

function setReg(r, f, v, isManual = false) {
  const oth = sum(act().filter(t => t.r == r && t.date == D && t.src != 'register'), f);
  const q = reqCrates(r, D);
  const regTxs = S.tx.filter(t => t.r == r && t.date == D && t.src == 'register' && !t.void);
  let g = regTxs[0];

  if (v === undefined && f === 'iss') {
    if (g) {
      g.issManual = false;
      g.iss = q;
    }
    return;
  }

  const nv = Math.max(0, (v != null ? v : (f === 'iss' ? q : 0)) - oth);

  if (!g) {
    if (!nv && f !== 'iss') return;
    g = { id: S.seq++, date: D, r, b: 'Total', iss: f === 'iss' ? nv : q, ret: f === 'ret' ? nv : 0, loose: 0, cap: 12, note: 'Daily register delivery', src: 'register', void: 0, issManual: f === 'iss' && isManual };
    S.tx.push(g);
  } else {
    if (regTxs.length > 1) {
      const otherF = f === 'iss' ? 'ret' : 'iss';
      const otherSum = sum(regTxs, otherF);
      g[otherF] = otherSum;
      g.b = 'Total';
      for (let i = 1; i < regTxs.length; i++) regTxs[i].void = 1;
    }
  }

  if (f === 'iss' && isManual) g.issManual = true;
  if (g[f] == nv) return;
  log('Register entry', `${RT(r).name} · Crates · ${f == 'iss' ? 'issued' : 'returned'} ${g[f]} → ${nv} on ${D}`);
  g[f] = nv;
}

document.addEventListener('keydown', e => {

  if (!m) return;
  e.preventDefault();
  commit(el);
  const n = document.querySelector(`#reg input[data-r="${+el.dataset.r + m[0]}"][data-c="${+el.dataset.c + m[1]}"]`);

  }), V = R.map(r => r.slice(0, 7));

  const totPouches = R.reduce((a, r) => a + r[2], 0);

  // 2nd Confirmation (Double Verification)
  if (!confirm(`Final Confirmation: Are you really sure you want to permanently delete "${r.name}"? All associated orders and crate records will be removed.`)) return;

  const name = r.name;
  S.ret = S.ret.filter(x => x.id !== id);
  for (const date in S.orders) {
    if (S.orders[date] && S.orders[date][id]) {
      delete S.orders[date][id];
    }
  }
  if (S.pay) S.pay = S.pay.filter(x => x.r !== id);
  if (S.tx) S.tx = S.tx.filter(x => x.r !== id);
  if (S.intake) S.intake = S.intake.filter(x => x.r !== id);
  if (BL === id) BL = S.ret[0] ? S.ret[0].id : '';

  go();

function daysBetween(d1, d2) {
  if (!d1 || !d2) return 999;
  const t1 = new Date(d1 + 'T00:00:00Z').getTime();
  const t2 = new Date(d2 + 'T00:00:00Z').getTime();
  return Math.round((t2 - t1) / (1000 * 60 * 60 * 24));
}

function getMonthLastDay(y, m) {
  return new Date(y, m, 0).getDate();
}

function getNextAutoBackupSchedule(refDate = (D || TODAY)) {
  const y = Number(refDate.slice(0, 4));
  const m = Number(refDate.slice(5, 7));
  const day = Number(refDate.slice(8, 10));
  const lastDay = getMonthLastDay(y, m);

  if (day < 15) {
    const nextDate = `${y}-${String(m).padStart(2, '0')}-15`;
    return {
      type: '15th',
      title: '15-Day Mid-Month',
      date: nextDate,
      daysRemaining: 15 - day,
      lastDay
    };
  } else if (day < lastDay) {
    const nextDate = `${y}-${String(m).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
    return {
      type: 'month-end',
      title: `Month-End Final (Day ${lastDay})`,
      date: nextDate,
      daysRemaining: lastDay - day,
      lastDay
    };
  } else {
    // Current date is lastDay or later: next is 15th of next month
    const nextM = m === 12 ? 1 : m + 1;
    const nextY = m === 12 ? y + 1 : y;
    const nextDate = `${nextY}-${String(nextM).padStart(2, '0')}-15`;
    return {
      type: '15th',
      title: '15-Day Mid-Month',
      date: nextDate,
      daysRemaining: Math.max(1, daysBetween(refDate, nextDate)),
      lastDay
    };
  }
}

function exportAllMonthlyExcel(targetMM = MM, curDate = (D || TODAY), maxDay = 0, suffix = '') {
  if (typeof XLSX === 'undefined') {
    toast('Excel engine loading, please try again');
    return 'Pending Excel engine';
  }
  const wb = XLSX.utils.book_new();

  // 1. Monthly Summary Sheet across all retailers
  const sumHeader = ['Customer ID', 'Customer Name', 'Route', 'Mobile', 'Purchases (₹)', 'Paid Jama (₹)', 'Balance Pending (₹)'];
  const sumRows = S.ret.map(r => {
    const sheet = buildCustomerSheetData(r.id, targetMM, maxDay);
    const cs = i => sheet.rows.reduce((a, x) => a + (+x[i] || 0), 0);
    const purchase = cs(sheet.nb);
    const paid = cs(sheet.nb + 5);
    const pending = sheet.rows.length ? sheet.rows[sheet.rows.length - 1][sheet.nb + 6] : outst(r.id);
    return [r.id, r.name, r.route || '', r.mob || '', Math.round(purchase), Math.round(paid), Math.round(pending)];
  });
  const sumTot = [
    'Total', '', '', '',
    sumRows.reduce((a, b) => a + b[4], 0),
    sumRows.reduce((a, b) => a + b[5], 0),
    sumRows.reduce((a, b) => a + b[6], 0)
  ];
  const summaryWs = XLSX.utils.aoa_to_sheet([sumHeader, ...sumRows, sumTot]);
  XLSX.utils.book_append_sheet(wb, summaryWs, 'Monthly Summary');

  // 2. Individual Customer Sheets
  const usedNames = new Set(['monthly summary']);
  S.ret.forEach(r => {
    const sheet = buildCustomerSheetData(r.id, targetMM, maxDay);
    const cs = i => sheet.rows.reduce((a, x) => a + (+x[i] || 0), 0);
    const totRow = [
      'Total',
      ...sheet.P.map((p, idx) => cs(idx + 1)),
      cs(sheet.nb),
      '',
      '',
      cs(sheet.nb + 3),
      cs(sheet.nb + 4),
      cs(sheet.nb + 5),
      sheet.rows.length ? sheet.rows[sheet.rows.length - 1][sheet.nb + 6] : 0,
      ''
    ];
    const ws = XLSX.utils.aoa_to_sheet([sheet.header, ...sheet.rows, totRow]);
    let baseName = (r.name || r.id).replace(/[:\\/\?\*\[\]]/g, '_').trim().slice(0, 25) || r.id;
    let sName = baseName;
    let counter = 1;
    while (usedNames.has(sName.toLowerCase())) {
      sName = `${baseName.slice(0, 22)}_${counter++}`;
    }
    usedNames.add(sName.toLowerCase());
    XLSX.utils.book_append_sheet(wb, ws, sName.slice(0, 31));
  });

  const fileSuffix = suffix ? `_${suffix}` : '';
  const fileName = `Monthly_Milk_Record_${targetMM}${fileSuffix}.xlsx`;
  XLSX.writeFile(wb, fileName);
  toast('Monthly Excel workbook downloaded: ' + fileName);
  return fileName;
}

function trigger15DayAutoDownload(forcedCycleType) {
  const curDate = D || TODAY;
  const targetMM = curDate.slice(0, 7);
  const y = Number(curDate.slice(0, 4));
  const m = Number(curDate.slice(5, 7));
  const day = Number(curDate.slice(8, 10));
  const lastDay = getMonthLastDay(y, m);

  // Determine cycle: '15th' (mid-month 15-day report) or 'month-end' (final report up to last day: 28, 29, 30, or 31)
  let cycle = forcedCycleType || (day < 20 ? '15th' : 'month-end');
  const is15th = cycle === '15th';
  const cycleKey = `${targetMM}_${cycle}`;
  const suffix = is15th ? '15Days' : `MonthEnd_Day${lastDay}`;
  const maxDay = is15th ? 15 : lastDay;
  const cycleTitle = is15th ? '15-Day Mid-Month (१५ दिवस)' : `Month-End Final (Day ${lastDay} / महिन्याचा शेवट)`;

  // 1. Download Full Company JSON Backup
  const jsonName = exportFullJSONBackup(curDate, suffix);

  // 2. Download Monthly Excel Report staggered by 700ms
  setTimeout(() => {
    const xlsxName = exportAllMonthlyExcel(targetMM, curDate, maxDay, suffix);

    // Update auto tracking history
    S.cfg.lastAuto15 = curDate;
    S.cfg.lastAutoType = cycleTitle;
    S.cfg.autoHistory = S.cfg.autoHistory || [];
    if (!S.cfg.autoHistory.includes(cycleKey)) {
      S.cfg.autoHistory.push(cycleKey);
    }
    save();
    if (page === 'set') go();

    // Show modal popup with full details
    show15DayBackupModal(xlsxName, jsonName, curDate, cycleTitle, maxDay, lastDay);
  }, 700);
}

function check15DayAutoBackup(force = false) {
  if (!force && S.cfg.auto15 === 0) return;
  const curDate = D || TODAY;
  const targetMM = curDate.slice(0, 7);
  const y = Number(curDate.slice(0, 4));
  const m = Number(curDate.slice(5, 7));
  const day = Number(curDate.slice(8, 10));
  const lastDay = getMonthLastDay(y, m);

  S.cfg.autoHistory = S.cfg.autoHistory || [];

  if (force) {
    trigger15DayAutoDownload();
    return;
  }

  // 1. Check if Month-End auto-download is due (day >= lastDay: 28, 29, 30, or 31)
  if (day >= lastDay) {
    const endKey = `${targetMM}_month-end`;
    if (!S.cfg.autoHistory.includes(endKey)) {
      trigger15DayAutoDownload('month-end');
      return;
    }
  }

  // 2. Check if 15-Day Mid-Month auto-download is due (day >= 15 and day < lastDay)
  if (day >= 15) {
    const midKey = `${targetMM}_15th`;
    if (!S.cfg.autoHistory.includes(midKey)) {
      trigger15DayAutoDownload('15th');
      return;
    }
  }
}

function restoreFullJSONBackup(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.prod || !parsed.ret) {
        alert('Invalid backup file structure');
        return;
      }
      S = parsed;
      fix();
      save();
      go();
      toast('Backup restored successfully!');
    } catch(err) {
      alert('Error restoring backup: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function buildCustomerSheetData(rid, monthStr, maxDay = 0) {
  const [y, m] = monthStr.split('-').map(Number);
  const monthTotalDays = new Date(y, m, 0).getDate();
  const n = maxDay ? Math.min(monthTotalDays, maxDay) : monthTotalDays;
  const ds = [];
  for (let i = 1; i <= n; i++) {
    const d = monthStr + '-' + String(i).padStart(2, '0');
    const maxD = (typeof D !== 'undefined' && D > TODAY) ? D : TODAY;
    if (maxDay || d <= maxD || monthStr < maxD.slice(0, 7)) ds.push(d);
  }

  const r = RT(rid);
  const P = S.prod;
  const nb = P.length + 1;
  const header = ['Date', ...P.map(p => p.brand + ' - ' + p.name), 'Todays Payment', 'Pre. Balance', 'Total Amount', 'Cash Jama', 'Online Jama', 'Total Jama', 'Balance Pending', 'Remarks'];

  const rows = [];
  let prevBal = coR(r.id, addD(monthStr + '-01', -1));

  ds.forEach(d => {
    const o = (S.orders[d] || {})[r.id] || {};
    let todaysPay = 0;
    const quantities = P.map(p => {
      const q = o[p.id];
      if (q != null && q > 0) {
        todaysPay += (q * rate(p, d));
        return q;
      }
      return '';
    });

    const totalAmt = prevBal + todaysPay;
    const dayPayments = S.pay.filter(x => x.r == r.id && !x.void && x.date == d);
    const cash = dayPayments.filter(x => x.m == 'Cash').reduce((a, b) => a + b.amt, 0);
    const online = dayPayments.filter(x => x.m != 'Cash').reduce((a, b) => a + b.amt, 0);
    const totalJama = cash + online;
    const balancePending = totalAmt - totalJama;

    const intakeOrd = (S.intake || []).find(x => x.r == r.id && x.date == d);
    let note = '';
    if (intakeOrd && intakeOrd.note) note = intakeOrd.note;
    else if (todaysPay === 0 && d <= TODAY) note = 'Sutti';

    rows.push([
      d,
      ...quantities,
      Math.round(todaysPay * 100) / 100,
      Math.round(prevBal * 100) / 100,
      Math.round(totalAmt * 100) / 100,
      cash || '',
      online || '',
      totalJama || '',
      Math.round(balancePending * 100) / 100,
      note
    ]);

    prevBal = balancePending;
  });

  return { header, rows, P, nb };
}

function downloadExcelAOA(aoaData, fileName, sheetName = 'Sheet1') {
  if (typeof XLSX === 'undefined') {

function resetCustomerMonth() {
  const r = RT(MR2);

function importExcelFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.SheetNames[0];
      const json = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet], { header: 1 });
      if (!json || json.length < 2) {
        alert('File is empty or invalid format');
        return;
      }
      toast(`Imported ${json.length - 1} rows from Excel!`);
      save();
      go();
    } catch (err) {
      alert('Error parsing Excel file: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

async function sendWhatsAppBill(rid, d) {
  const r = RT(rid);
  if (!r) return;
  let mob = (r.mob || r.phone || '').trim().replace(/\D/g, '');
  if (!mob) {
    const entered = prompt(`Retailer "${r.name}" does not have a saved WhatsApp mobile number.\nPlease enter 10-digit mobile number:`);
    if (!entered) return;
    mob = entered.trim().replace(/\D/g, '');
    if (mob) {
      r.mob = mob;
      save();
    } else {
      return;
    }
  }
  const cleanMob = mob.length === 10 ? '91' + mob : mob;

  // 1. Render the bill to canvas
  const c = document.createElement('canvas');
  drawBill(c, rid, d);
  const cleanName = r.name.replace(/[^a-zA-Z0-9_\u0900-\u097F]/g, '_');
  const fileName = `Bill_${cleanName}_${d}.png`;

  // 2. Convert to Blob & copy to clipboard WHILE FOCUSED
  try {
    const blob = await new Promise(resolve => c.toBlob(resolve, 'image/png'));
    if (blob && navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    }
    // Also auto-download as immediate file backup
    if (blob) {
      const a = document.createElement('a');
      a.download = fileName;
      a.href = URL.createObjectURL(blob);
      a.click();
    }
  } catch (err) {
    console.warn('Clipboard write error:', err);
  }

  // 3. Open WhatsApp directly to this particular customer's phone number
  const waUrl = `https://api.whatsapp.com/send?phone=${cleanMob}`;
  window.open(waUrl, '_blank');

  // 4. Show clear notification
  toast(`📸 बिलाचा फोटो कॉपी झाला आहे! व्हॉट्सअ‍ॅपमध्ये फक्त Ctrl + V (Paste) दाबा आणि पाठवा!`);
}

DK.sort((a, b) => b[2] - a[2]);
const trs = s => S.cfg.mr ? DK.reduce((a, k) => a.replace(k[0], () => k[1]), s) : s;
function tr(root) {
  if (!S.cfg.mr || !root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), L = [];
  let n;
  while (n = w.nextNode()) L.push(n);
  L.forEach(n => { if (/[A-Za-z]/.test(n.nodeValue)) n.nodeValue = trs(n.nodeValue); });
  root.querySelectorAll('[placeholder]').forEach(e => e.placeholder = trs(e.placeholder));
}
